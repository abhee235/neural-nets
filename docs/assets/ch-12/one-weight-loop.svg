<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">one weight, one step — the whole of learning, playing on loop</text>

  <!--
    Four phases, 3s each, repeating (dur 12s, discrete opacity):
      phase 1  FORWARD    p = 2×3 = 6,  L = (6−10)² = 16
      phase 2  BACKWARD   dL/dp = −8,  dL/dw = (−8)·2 = −16
      phase 3  UPDATE     w ← 3 − 0.1·(−16) = 4.6
      phase 4  AGAIN      p = 2×4.6 = 9.2,  L = 0.64
    Elements appear at their phase and stay until the loop restarts.
    All six numbers verified through the reader's own mseLoss and engine.
  -->

  <!-- ══════════ static graph skeleton ══════════ -->
  <g font-family="monospace">
    <!-- nodes -->
    <rect x="60"  y="60" width="90" height="34" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
    <text x="105" y="82" text-anchor="middle" font-size="11" fill="#2c2416">x = 2</text>

    <rect x="60"  y="130" width="90" height="34" rx="6" fill="#e4efe4" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="105" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">w = 3</text>
    <text x="105" y="178" text-anchor="middle" font-size="8" fill="#8b7355">the only thing that can change</text>

    <rect x="230" y="95" width="70" height="34" rx="17" fill="#faf7f0" stroke="#8b7355"/>
    <text x="265" y="117" text-anchor="middle" font-size="11" fill="#2c2416">mul</text>

    <rect x="370" y="95" width="96" height="34" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
    <text x="418" y="117" text-anchor="middle" font-size="11" fill="#2c2416">p = ?</text>

    <rect x="530" y="95" width="130" height="34" rx="17" fill="#faf7f0" stroke="#8b7355"/>
    <text x="595" y="112" text-anchor="middle" font-size="10" fill="#2c2416">mseLoss</text>
    <text x="595" y="124" text-anchor="middle" font-size="8" fill="#8b7355">truth = 10</text>

    <!-- forward edges -->
    <line x1="150" y1="77"  x2="230" y2="105" stroke="#c9b88a" stroke-width="1.5"/>
    <line x1="150" y1="147" x2="230" y2="120" stroke="#c9b88a" stroke-width="1.5"/>
    <line x1="300" y1="112" x2="370" y2="112" stroke="#c9b88a" stroke-width="1.5"/>
    <line x1="466" y1="112" x2="530" y2="112" stroke="#c9b88a" stroke-width="1.5"/>
  </g>

  <!-- ══════════ phase 1: FORWARD ══════════ -->
  <g font-family="monospace">
    <text x="418" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#1e6091">p = 6</text>
    <rect x="530" y="150" width="130" height="30" rx="6" fill="#f3e6e4" stroke="#a94442"/>
    <text x="595" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#a94442">L = 16</text>
    <text x="595" y="196" text-anchor="middle" font-size="8.5" fill="#8b7355">6 is too small — truth is 10</text>
  </g>

  <!-- ══════════ phase 2: BACKWARD (appears at 3s) ══════════ -->
  <g font-family="monospace" opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.25" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <path d="M 530 128 Q 480 150 466 128" fill="none" stroke="#a94442" stroke-width="1.75" stroke-dasharray="4 3"/>
    <text x="470" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#a94442">dL/dp = −8</text>
    <path d="M 240 128 Q 190 165 152 152" fill="none" stroke="#a94442" stroke-width="1.75" stroke-dasharray="4 3"/>
    <text x="235" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#a94442">dL/dw = −8·2 = −16</text>
    <text x="360" y="222" text-anchor="middle" font-size="9" fill="#a94442">backward(): the chain rule, two hops — the gradient flows THROUGH p into w</text>
  </g>

  <!-- ══════════ phase 3: UPDATE (appears at 6s) ══════════ -->
  <g font-family="monospace" opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="60" y="245" width="330" height="48" rx="8" fill="#e4efe4" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="225" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#2e7d32">optimizer  (not backprop — Ch 09's step)</text>
    <text x="225" y="282" text-anchor="middle" font-size="11" fill="#2c2416">w ← 3 − 0.1·(−16) = 4.6</text>
    <text x="225" y="308" text-anchor="middle" font-size="8.5" fill="#8b7355">subtracting a negative raises w — the sign carried "too small" by itself</text>
  </g>

  <!-- ══════════ phase 4: FORWARD AGAIN (appears at 9s) ══════════ -->
  <g font-family="monospace" opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <rect x="430" y="245" width="230" height="48" rx="8" fill="#ede7d3" stroke="#1e6091" stroke-width="1.5"/>
    <text x="545" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#1e6091">forward again</text>
    <text x="545" y="282" text-anchor="middle" font-size="11" fill="#2c2416">p = 2×4.6 = 9.2   L = 0.64</text>
    <text x="545" y="308" text-anchor="middle" font-size="9" font-weight="700" fill="#2e7d32">loss: 16 → 0.64. the model learned.</text>
  </g>

  <!-- ══════════ phase indicator ══════════ -->
  <g font-family="monospace" font-size="9.5" text-anchor="middle">
    <rect x="60" y="338" width="600" height="26" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
    <text x="150" y="355" fill="#1e6091" font-weight="700">1 forward
      <animate attributeName="opacity" values="1;0.35;0.35;0.35" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="300" y="355" fill="#a94442" font-weight="700">2 backward
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="450" y="355" fill="#2e7d32" font-weight="700">3 update
      <animate attributeName="opacity" values="0.35;0.35;1;0.35" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="590" y="355" fill="#1e6091" font-weight="700">4 forward again
      <animate attributeName="opacity" values="0.35;0.35;0.35;1" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <text x="360" y="384" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#8b7355">every training run in this course — up to Ch 30's GPT — is this loop, repeated</text>

</svg>
