<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">the gradient p − y: what the model predicted, minus what was true</text>

  <!--
    Left: bars. p = [0.090031, 0.244728, 0.665241] (solid), y = [1, 0, 0]
    (outline, only sat). Baseline y=280, height scale 190px per 1.0:
      sat  p bar 17.1 tall (y 262.9);  y outline 190 tall (y 90)
      ran  p bar 46.5 tall (y 233.5)
      flew p bar 126.4 tall (y 153.6)
    Right: the gradient rows and arrows, lengths 80·|g|:
      sat  −0.909969 → UP  72.8    ran +0.244728 → down 19.6
      flew +0.665241 → down 53.2   sum = 0 exactly
    Arrows pulse via opacity. All numbers machine-verified.
  -->

  <line x1="392" y1="44" x2="392" y2="356" stroke="#e0d9c5" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ══════════ LEFT — p vs y ══════════ -->
  <text x="216" y="52" text-anchor="middle" fill="#5a4220" font-family="monospace" font-size="11" font-weight="700">what it said  vs  what was true</text>

  <line x1="60" y1="280" x2="372" y2="280" stroke="#c9b88a" stroke-width="1.5"/>

  <!-- sat: truth outline + tiny p bar -->
  <rect x="80" y="90" width="64" height="190" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="112" y="82" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="9" font-weight="700">y = 1 (truth)</text>
  <rect x="80" y="262.9" width="64" height="17.1" fill="#1e6091"/>
  <text x="112" y="256" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="9">0.090</text>
  <text x="112" y="298" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="10" font-weight="700">sat</text>

  <!-- ran -->
  <rect x="184" y="233.5" width="64" height="46.5" fill="#1e6091"/>
  <text x="216" y="227" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="9">0.245</text>
  <text x="216" y="298" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="10">ran</text>

  <!-- flew -->
  <rect x="288" y="153.6" width="64" height="126.4" fill="#1e6091"/>
  <text x="320" y="147" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="9">0.665</text>
  <text x="320" y="298" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="10">flew</text>

  <text x="216" y="326" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="8.5">the gap between each bar and its truth IS the gradient:</text>
  <text x="216" y="340" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="9.5" font-weight="600">p − y  =  [ −0.910   0.245   0.665 ]</text>

  <!-- ══════════ RIGHT — the instructions ══════════ -->
  <text x="552" y="52" text-anchor="middle" fill="#5a4220" font-family="monospace" font-size="11" font-weight="700">read as instructions to the scores</text>

  <g font-family="monospace">
    <!-- sat: big UP arrow -->
    <text x="430" y="120" font-size="10" font-weight="700" fill="#2c2416">sat</text>
    <text x="478" y="120" font-size="9" fill="#8b7355">gradient −0.910</text>
    <line x1="620" y1="146" x2="620" y2="73.2" stroke="#2e7d32" stroke-width="5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <path d="M 620 66 l -8 12 l 16 0 z" fill="#2e7d32">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="640" y="110" font-size="9" font-weight="700" fill="#2e7d32">UP, hard</text>
    <text x="430" y="136" font-size="8" fill="#8b7355">the truth, given far too little</text>

    <!-- ran: small down arrow -->
    <text x="430" y="192" font-size="10" fill="#2c2416">ran</text>
    <text x="478" y="192" font-size="9" fill="#8b7355">gradient +0.245</text>
    <line x1="620" y1="172" x2="620" y2="191.6" stroke="#a94442" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <path d="M 620 199 l -6 -10 l 12 0 z" fill="#a94442">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="640" y="190" font-size="9" fill="#a94442">down</text>

    <!-- flew: big down arrow -->
    <text x="430" y="252" font-size="10" fill="#2c2416">flew</text>
    <text x="478" y="252" font-size="9" fill="#8b7355">gradient +0.665</text>
    <line x1="620" y1="226" x2="620" y2="279.2" stroke="#a94442" stroke-width="5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <path d="M 620 287 l -8 -12 l 16 0 z" fill="#a94442">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="640" y="256" font-size="9" font-weight="700" fill="#a94442">down, hardest</text>
    <text x="430" y="268" font-size="8" fill="#8b7355">took the most it should not have</text>
  </g>

  <rect x="416" y="306" width="272" height="42" rx="7" fill="#ede7d3" stroke="#c9b88a"/>
  <text x="552" y="323" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c2416">−0.910 + 0.245 + 0.665 = 0, always</text>
  <text x="552" y="338" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#8b7355">the loss only REDISTRIBUTES confidence — never all up, never all down</text>

  <!-- footer -->
  <rect x="30" y="364" width="660" height="26" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
  <text x="360" y="381" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#5a4220" font-weight="600">
    every score gets a signed, sized instruction on every step — compare the mistake count, whose slope was zero everywhere
  </text>

</svg>
