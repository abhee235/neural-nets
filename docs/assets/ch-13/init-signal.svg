<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">what the starting scale does to a signal — ten layers, width 100, measured</text>

  <!--
    log10(signal std) against layer 0..10.  px = 70 + 57·layer,  py = 190 − 11.8·log10.
    raw randn:   ×10 per layer  → log10 = +layer   (explodes to 1e10)
    randn×0.01:  ÷10 per layer  → log10 = −layer   (vanishes to 1e-10)
    randn×√(1/100): steady      → log10 ≈ 0
    Values from the measurement in the doc's section 6 table.
  -->

  <!-- axes -->
  <line x1="70" y1="330" x2="655" y2="330" stroke="#c9b88a" stroke-width="1.5"/>
  <line x1="70" y1="55"  x2="70"  y2="330" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="360" y="356" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="10">layer</text>
  <g font-family="monospace" font-size="8.5" fill="#a8956a" text-anchor="middle">
    <text x="70"  y="344">0</text>
    <text x="184" y="344">2</text>
    <text x="298" y="344">4</text>
    <text x="412" y="344">6</text>
    <text x="526" y="344">8</text>
    <text x="640" y="344">10</text>
  </g>
  <!-- y ticks: log scale -->
  <g font-family="monospace" font-size="8.5" fill="#a8956a" text-anchor="end">
    <text x="64" y="76">1e10</text>
    <text x="64" y="135">1e5</text>
    <text x="64" y="194">1</text>
    <text x="64" y="253">1e-5</text>
    <text x="64" y="312">1e-10</text>
  </g>
  <text x="30" y="215" fill="#8b7355" font-family="monospace" font-size="9.5" transform="rotate(-90 30 215)">signal size (log scale)</text>
  <line x1="70" y1="190" x2="655" y2="190" stroke="#d8cfb4" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- raw randn: explodes -->
  <polyline fill="none" stroke="#a94442" stroke-width="2.5"
    points="70,190.0 127,178.2 184,166.4 241,154.6 298,142.8 355,131.0 412,119.2 469,107.4 526,95.6 583,83.8 640,72.0"/>
  <text x="612" y="66" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="9.5" font-weight="700">randn as-is: ×10 per layer</text>

  <!-- ×0.01: vanishes -->
  <polyline fill="none" stroke="#a94442" stroke-width="2.5" stroke-dasharray="6 3"
    points="70,190.0 127,201.8 184,213.6 241,225.4 298,237.2 355,249.0 412,260.8 469,272.6 526,284.4 583,296.2 640,308.0"/>
  <text x="600" y="322" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="9.5" font-weight="700">× 0.01: ÷10 per layer</text>

  <!-- √(1/n): steady -->
  <polyline fill="none" stroke="#2e7d32" stroke-width="3"
    points="70,190.0 127,190.0 184,190.0 241,190.0 298,190.0 355,190.0 412,190.0 469,190.0 526,190.0 583,190.0 640,190.0"/>
  <text x="480" y="181" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="9.5" font-weight="700">× √(1/100): steady at 1</text>

  <!-- markers walking the three lines -->
  <circle r="5" fill="#a94442">
    <animate attributeName="cx" values="70;640" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;72" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#a94442" opacity="0.8">
    <animate attributeName="cx" values="70;640" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;308" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#2e7d32">
    <animate attributeName="cx" values="70;640" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;190" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- footer: the reason -->
  <rect x="30" y="366" width="660" height="26" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
  <text x="360" y="378" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#5a4220" font-weight="600">
    each output sums 100 products, and a sum of n independent terms grows by √n —
  </text>
  <text x="360" y="389" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#5a4220" font-weight="600">
    so dividing the weights by √n cancels the growth exactly. that is the whole derivation.
  </text>

</svg>
