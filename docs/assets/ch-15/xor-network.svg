<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <text x="360" y="22" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">the XOR network — where its 33 learnable numbers actually live</text>

  <!--
    Linear(2, 8) then relu then Linear(8, 1).
      W1 [8,2] = 16 weights, one per (hidden unit, input) pair
      b1 [8]   =  8 biases,  one per hidden unit
      W2 [1,8] =  8 weights, one per hidden unit
      b2 [1]   =  1 bias
                 ======
                   33  = the "4 tensors, 33 numbers" the chapter reports
    16 pale edges on the left are W1; 8 blue edges on the right are W2.
  -->

  <line x1="134" y1="150" x2="324" y2="70" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="100" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="130" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="160" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="190" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="220" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="250" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="150" x2="324" y2="280" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="70" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="100" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="130" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="160" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="190" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="220" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="250" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="134" y1="250" x2="324" y2="280" stroke="#c9b88a" stroke-width="0.9" opacity="0.6"/>
  <line x1="356" y1="70" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="100" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="130" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="160" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="190" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="220" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="250" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>
  <line x1="356" y1="280" x2="556" y2="175" stroke="#1e6091" stroke-width="1.1" opacity="0.6"/>

  <!-- inputs -->
  <circle cx="110" cy="150" r="24" fill="#ede7d3" stroke="#c9b88a" stroke-width="2"/>
  <text x="110" y="154" text-anchor="middle" font-family="monospace" font-size="11" fill="#2c2416">x₁</text>
  <circle cx="110" cy="250" r="24" fill="#ede7d3" stroke="#c9b88a" stroke-width="2"/>
  <text x="110" y="254" text-anchor="middle" font-family="monospace" font-size="11" fill="#2c2416">x₂</text>
  <text x="110" y="106" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#8b7355">inputs</text>
  <text x="110" y="296" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#8b7355">given — not learned</text>

  <circle cx="340" cy="70" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="74" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h1</text>
  <circle cx="340" cy="100" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="104" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h2</text>
  <circle cx="340" cy="130" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="134" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h3</text>
  <circle cx="340" cy="160" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="164" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h4</text>
  <circle cx="340" cy="190" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="194" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h5</text>
  <circle cx="340" cy="220" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="224" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h6</text>
  <circle cx="340" cy="250" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="254" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h7</text>
  <circle cx="340" cy="280" r="16" fill="#ede7d3" stroke="#1e6091" stroke-width="1.6"/>
  <text x="340" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e6091">h8</text>
  <text x="340" y="44" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#8b7355">8 hidden units, each with relu</text>
  <text x="340" y="318" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#8b7355">activations — computed, not stored</text>

  <!-- output -->
  <circle cx="580" cy="175" r="24" fill="#ede7d3" stroke="#a94442" stroke-width="2"/>
  <text x="580" y="179" text-anchor="middle" font-family="monospace" font-size="11" fill="#a94442">y</text>
  <text x="580" y="130" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#8b7355">output</text>

  <!-- what each bundle of edges is -->
  <rect x="196" y="330" width="140" height="46" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
  <text x="266" y="346" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#5a4220">W₁  [8, 2]  =  16</text>
  <text x="266" y="359" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b7355">one per edge, left side</text>
  <text x="266" y="371" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b7355">b₁  [8]  =  8, one per unit</text>

  <rect x="392" y="330" width="140" height="46" rx="6" fill="#ede7d3" stroke="#1e6091"/>
  <text x="462" y="346" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#1e6091">W₂  [1, 8]  =  8</text>
  <text x="462" y="359" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b7355">one per edge, right side</text>
  <text x="462" y="371" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b7355">b₂  [1]  =  1</text>

  <rect x="556" y="330" width="132" height="46" rx="6" fill="#e4efe4" stroke="#2e7d32"/>
  <text x="622" y="349" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#2e7d32">33 parameters</text>
  <text x="622" y="366" text-anchor="middle" font-family="monospace" font-size="8" fill="#8b7355">in 4 tensors, one flat list</text>

  <text x="70" y="352" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b7355">every</text>
  <text x="70" y="364" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b7355">edge is a</text>
  <text x="70" y="376" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#5a4220">weight</text>

</svg>
