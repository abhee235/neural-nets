<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">

  <rect width="720" height="430" fill="#faf7f0" rx="12"/>
  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">one network, two ways to count its layers</text>

  <!-- ══════ READING 1: count the circle columns ══════ -->
  <line x1="167" y1="110" x2="333" y2="85" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="167" y1="110" x2="333" y2="135" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="167" y1="110" x2="333" y2="185" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="167" y1="160" x2="333" y2="85" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="167" y1="160" x2="333" y2="135" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="167" y1="160" x2="333" y2="185" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="367" y1="85" x2="533" y2="135" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="367" y1="135" x2="533" y2="135" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<line x1="367" y1="185" x2="533" y2="135" stroke="#c9b88a" stroke-width="1" opacity="0.55"/>
<circle cx="150" cy="110" r="17" fill="#ede7d3" stroke="#c9b88a" stroke-width="2"/>
<circle cx="150" cy="160" r="17" fill="#ede7d3" stroke="#c9b88a" stroke-width="2"/>
<circle cx="350" cy="85" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>
<circle cx="350" cy="135" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>
<circle cx="350" cy="185" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>
<circle cx="550" cy="135" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>

  <text x="150" y="62" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#8b7355">input layer</text>
  <text x="350" y="62" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#1e6091">hidden layer</text>
  <text x="550" y="62" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#1e6091">output layer</text>

  <rect x="132" y="76" width="36" height="118" rx="8" fill="none" stroke="#8b7355" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="332" y="60" width="36" height="150" rx="8" fill="none" stroke="#1e6091" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="532" y="110" width="36" height="50"  rx="8" fill="none" stroke="#1e6091" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="628" y="112" font-family="monospace" font-size="10" font-weight="700" fill="#5a4220">counting</text>
  <text x="628" y="126" font-family="monospace" font-size="10" font-weight="700" fill="#5a4220">circles:</text>
  <text x="628" y="146" font-family="monospace" font-size="16" font-weight="700" fill="#8b7355">3</text>
  <text x="628" y="162" font-family="monospace" font-size="9" fill="#8b7355">layers</text>

  <text x="52" y="140" font-family="monospace" font-size="9" fill="#8b7355">the older</text>
  <text x="52" y="152" font-family="monospace" font-size="9" fill="#8b7355">usage, and</text>
  <text x="52" y="164" font-family="monospace" font-size="9" fill="#8b7355">most diagrams</text>

  <line x1="30" y1="222" x2="690" y2="222" stroke="#c9b88a" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ══════ READING 2: count the weight matrices ══════ -->
  <line x1="167" y1="280" x2="333" y2="255" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="167" y1="280" x2="333" y2="305" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="167" y1="280" x2="333" y2="355" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="167" y1="330" x2="333" y2="255" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="167" y1="330" x2="333" y2="305" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="167" y1="330" x2="333" y2="355" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="367" y1="255" x2="533" y2="305" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="367" y1="305" x2="533" y2="305" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<line x1="367" y1="355" x2="533" y2="305" stroke="#2e7d32" stroke-width="1.4" opacity="0.75"/>
<circle cx="150" cy="280" r="17" fill="#ede7d3" stroke="#c9b88a" stroke-width="2"/>
<circle cx="150" cy="330" r="17" fill="#ede7d3" stroke="#c9b88a" stroke-width="2"/>
<circle cx="350" cy="255" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>
<circle cx="350" cy="305" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>
<circle cx="350" cy="355" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>
<circle cx="550" cy="305" r="17" fill="#ede7d3" stroke="#1e6091" stroke-width="2"/>

  <rect x="172" y="230" width="156" height="150" rx="9" fill="#2e7d32" opacity="0.07"/>
  <rect x="172" y="230" width="156" height="150" rx="9" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
  <rect x="372" y="230" width="156" height="150" rx="9" fill="#2e7d32" opacity="0.07"/>
  <rect x="372" y="230" width="156" height="150" rx="9" fill="none" stroke="#2e7d32" stroke-width="1.6"/>

  <text x="250" y="222" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#2e7d32">layer 1 = Linear(2, 3)</text>
  <text x="250" y="394" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#5a4220">W₁ [3,2] + b₁ [3]</text>
  <text x="450" y="222" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#2e7d32">layer 2 = Linear(3, 1)</text>
  <text x="450" y="394" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#5a4220">W₂ [1,3] + b₂ [1]</text>

  <text x="628" y="282" font-family="monospace" font-size="10" font-weight="700" fill="#5a4220">counting</text>
  <text x="628" y="296" font-family="monospace" font-size="10" font-weight="700" fill="#5a4220">weights:</text>
  <text x="628" y="316" font-family="monospace" font-size="16" font-weight="700" fill="#2e7d32">2</text>
  <text x="628" y="332" font-family="monospace" font-size="9" fill="#2e7d32">layers</text>

  <text x="52" y="304" font-family="monospace" font-size="9" fill="#2e7d32">what the</text>
  <text x="52" y="316" font-family="monospace" font-size="9" fill="#2e7d32">code means,</text>
  <text x="52" y="328" font-family="monospace" font-size="9" fill="#2e7d32">and this book</text>

  <!-- footer -->
  <rect x="30" y="382" width="660" height="38" rx="6" fill="#ede7d3" stroke="#c9b88a"/>
  <text x="360" y="399" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="600" fill="#5a4220">a circle holds a value, recomputed for every input and thrown away — it owns nothing</text>
  <text x="360" y="413" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="600" fill="#2e7d32">an arrow holds a weight, kept between inputs and learned — so the arrows are what an object can be</text>

</svg>
