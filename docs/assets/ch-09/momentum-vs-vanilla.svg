<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <!-- ─── header ─────────────────────────────────────────────── -->
  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">momentum carries speed between steps — the same six steps, side by side</text>

  <!--
    Both runs: L(w) = (w−5)², start w = 0, η = 0.1. Momentum uses β = 0.9 with
    v ← βv − η·grad,  w ← w + v.  Every position below is that recurrence run
    out by hand:
      vanilla   w = 0, 1.0, 1.8,  2.44, 2.952, 3.362      (factor 0.8 each step)
      momentum  w = 0, 1.0, 2.7,  4.69, 6.543, 7.902
      velocity  v = 0, 1.0, 1.7,  1.99, 1.853, 1.359
    Momentum reaches the minimum by step 3 and then sails past it — the honest
    picture, and why β needs tuning (Ch 14).
  -->

  <!-- ─── the bowl ───────────────────────────────────────────── -->
  <path d="M60,174 L110,212.5 L160,244 L210,268.5 L260,286 L310,296.5 L360,300 L410,296.5 L460,286 L510,268.5 L560,244 L610,212.5 L660,174"
        fill="none" stroke="#c9b88a" stroke-width="2"/>
  <line x1="60" y1="300" x2="660" y2="300" stroke="#e0d9c5" stroke-width="1"/>

  <!-- minimum marker -->
  <circle cx="360" cy="300" r="4" fill="#2e7d32"/>
  <text x="360" y="318" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="10" font-weight="700">minimum, w = 5</text>

  <text x="110" y="200" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">start</text>

  <!-- ─── vanilla SGD trail ──────────────────────────────────── -->
  <circle cx="160"   cy="244"   r="2.5" fill="#cfd8e3"/>
  <circle cx="200"   cy="264.2" r="2.5" fill="#cfd8e3"/>
  <circle cx="232"   cy="277.1" r="2.5" fill="#cfd8e3"/>
  <circle cx="257.6" cy="285.3" r="2.5" fill="#cfd8e3"/>

  <circle r="8" fill="#1e6091">
    <animate attributeName="cx" values="110;160;200;232;257.6;278.1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="cy" values="212.5;244;264.2;277.1;285.3;290.6" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>

  <!-- ─── momentum trail ─────────────────────────────────────── -->
  <circle cx="160"   cy="244"   r="2.5" fill="#ded3ef"/>
  <circle cx="245"   cy="281.5" r="2.5" fill="#ded3ef"/>
  <circle cx="344.5" cy="299.7" r="2.5" fill="#ded3ef"/>
  <circle cx="437.2" cy="291.7" r="2.5" fill="#ded3ef"/>

  <circle r="8" fill="#6f42c1">
    <animate attributeName="cx" values="110;160;245;344.5;437.2;505.1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="cy" values="212.5;244;281.5;299.7;291.7;270.5" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>

  <!-- ─── legend ─────────────────────────────────────────────── -->
  <circle cx="76" cy="52" r="7" fill="#1e6091"/>
  <text x="90" y="56" fill="#1e6091" font-family="monospace" font-size="11" font-weight="700">vanilla SGD</text>
  <text x="90" y="69" fill="#a8956a" font-family="monospace" font-size="9">each step 0.8× the last — it decays</text>

  <circle cx="286" cy="52" r="7" fill="#6f42c1"/>
  <text x="300" y="56" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">momentum, β = 0.9</text>
  <text x="300" y="69" fill="#a8956a" font-family="monospace" font-size="9">steps GROW while the slope agrees</text>

  <!-- ─── velocity readout panel ─────────────────────────────── -->
  <rect x="530" y="38" width="160" height="86" rx="8" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="610" y="56" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">velocity v</text>
  <text x="610" y="82" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="14" font-weight="700">v: 0 → 1.0 → 1.7 → 1.99</text>
  <text x="610" y="102" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">grad shrinks, yet v keeps growing</text>
  <text x="610" y="115" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">v ← βv − η·grad</text>

  <!-- ─── the overshoot callout ──────────────────────────────── -->
  <path d="M505,258 L540,222" stroke="#a94442" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="548" y="218" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">overshoots —</text>
  <text x="548" y="231" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">inertia, not a bug</text>

  <!-- ─── axis label ─────────────────────────────────────────── -->
  <text x="360" y="340" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">w (the parameter)</text>

  <!-- ─── formula bar ────────────────────────────────────────── -->
  <rect x="30" y="356" width="660" height="36" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="372" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220" font-weight="600">
    along a consistent slope the contributions ADD (up to ~1/(1−β) = 10× at β = 0.9); across an oscillation they CANCEL
  </text>
  <text x="360" y="386" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b7355">
    that second property — damping, not speed — is the reason momentum survives into Adam (Ch 14)
  </text>

</svg>
