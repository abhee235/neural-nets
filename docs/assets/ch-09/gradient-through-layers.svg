<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">

  <rect width="720" height="420" fill="#faf7f0" rx="12"/>

  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">one update rule, four parameters, different distances from the loss</text>

  <!--
    Tiny 2-layer network:  z1 = w1·x + b1 → h = tanh(z1) → z2 = w2·h + b2 → L = (z2−y)²
    At w1=0.5, b1=0, w2=1, b2=0, x=1, y=1 — every value below is computed, not sketched.
    Forward row shows values; backward row shows the gradient arriving at each node.
  -->

  <!-- ═══════ FORWARD ROW ═══════════════════════════════════════ -->
  <text x="34" y="86" fill="#1e6091" font-family="monospace" font-size="10" font-weight="700">forward →</text>

  <line x1="150" y1="120" x2="196" y2="120" stroke="#c9b88a" stroke-width="1.5"/>
  <line x1="304" y1="120" x2="330" y2="120" stroke="#c9b88a" stroke-width="1.5"/>
  <line x1="410" y1="120" x2="436" y2="120" stroke="#c9b88a" stroke-width="1.5"/>
  <line x1="544" y1="120" x2="576" y2="120" stroke="#c9b88a" stroke-width="1.5"/>

  <!-- params feeding layer 1 -->
  <rect x="42" y="104" width="52" height="32" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="68" y="119" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">w1</text>
  <text x="68" y="131" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">0.5</text>
  <rect x="98" y="104" width="52" height="32" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="124" y="119" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">b1</text>
  <text x="124" y="131" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">0.0</text>

  <rect x="196" y="102" width="108" height="36" rx="6" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="250" y="117" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="10" font-weight="700">z1 = w1·x + b1</text>
  <text x="250" y="131" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="10">= 0.5</text>

  <rect x="330" y="102" width="80" height="36" rx="6" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="370" y="117" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="10" font-weight="700">h = tanh(z1)</text>
  <text x="370" y="131" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="10">= 0.4621</text>

  <!-- params feeding layer 2 -->
  <rect x="436" y="56" width="52" height="32" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="462" y="71" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">w2</text>
  <text x="462" y="83" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">1.0</text>
  <rect x="492" y="56" width="52" height="32" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="518" y="71" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">b2</text>
  <text x="518" y="83" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">0.0</text>
  <line x1="490" y1="88" x2="490" y2="102" stroke="#c9b88a" stroke-width="1.5"/>

  <rect x="436" y="102" width="108" height="36" rx="6" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="490" y="117" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="10" font-weight="700">z2 = w2·h + b2</text>
  <text x="490" y="131" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="10">= 0.4621</text>

  <rect x="576" y="102" width="104" height="36" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="628" y="117" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="10" font-weight="700">L = (z2 − y)²</text>
  <text x="628" y="131" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="10">= 0.2893</text>

  <!-- ═══════ BACKWARD ROW ═════════════════════════════════════ -->
  <text x="34" y="196" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">← backward</text>

  <line x1="150" y1="230" x2="196" y2="230" stroke="#e6cdc9" stroke-width="1.5"/>
  <line x1="304" y1="230" x2="330" y2="230" stroke="#e6cdc9" stroke-width="1.5"/>
  <line x1="410" y1="230" x2="436" y2="230" stroke="#e6cdc9" stroke-width="1.5"/>
  <line x1="544" y1="230" x2="576" y2="230" stroke="#e6cdc9" stroke-width="1.5"/>

  <!-- travelling pulse, right to left -->
  <circle r="8" fill="#a94442" opacity="0.9">
    <animate attributeName="cx" values="628;490;370;250;96" keyTimes="0;0.25;0.5;0.75;1" dur="5s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="cy" values="230;230;230;230;230" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="628" y="215" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="10" font-weight="700">seed = 1</text>
  <text x="628" y="252" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">∂L/∂L</text>

  <text x="490" y="215" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">−1.0758</text>
  <text x="490" y="252" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">×2(z2−y)</text>

  <text x="370" y="215" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">−1.0758</text>
  <text x="370" y="252" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">×w2 = 1.0</text>

  <text x="250" y="215" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">−0.8460</text>
  <text x="250" y="252" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">×(1−h²) = 0.7864</text>

  <text x="96" y="215" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="10" font-weight="700">−0.8460</text>
  <text x="96" y="252" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9">×x = 1.0</text>

  <!-- ═══════ THE POINT ════════════════════════════════════════ -->
  <rect x="30" y="272" width="320" height="80" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1"/>
  <text x="190" y="290" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="11" font-weight="700">different chain lengths</text>
  <text x="46" y="309" fill="#8b7355" font-family="monospace" font-size="10">∂L/∂b2 = −1.0758        ← 1 factor</text>
  <text x="46" y="325" fill="#8b7355" font-family="monospace" font-size="10">∂L/∂w2 = −0.4971        ← 2 factors</text>
  <text x="46" y="341" fill="#8b7355" font-family="monospace" font-size="10">∂L/∂w1 = −0.8460        ← 4 factors</text>

  <rect x="370" y="272" width="320" height="80" rx="8" fill="#f3eefb" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="530" y="290" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="700">…but ONE update rule</text>
  <text x="386" y="309" fill="#2c2416" font-family="monospace" font-size="10">for (const p of params)</text>
  <text x="386" y="325" fill="#2c2416" font-family="monospace" font-size="10">   p.data -= 0.1 * p.grad</text>
  <text x="386" y="343" fill="#8b7355" font-family="monospace" font-size="9">step() never learns how deep a parameter was</text>

  <!-- ═══════ formula bar ══════════════════════════════════════ -->
  <rect x="30" y="366" width="660" height="38" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="383" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220" font-weight="600">
    depth lives entirely inside backward() — by the time step() runs, every parameter is just a number and a gradient
  </text>
  <text x="360" y="397" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b7355">
    this is why the same four lines train a 4-parameter net and a 4-billion-parameter one
  </text>

</svg>
