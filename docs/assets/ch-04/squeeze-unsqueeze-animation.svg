<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <!-- ─── header ─────────────────────────────────────────────── -->
  <text x="360" y="22" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">unsqueeze inserts a size-1 axis  ·  squeeze removes one</text>

  <!--
    Animation timing
    ────────────────
    9 s cycle, 3 phases × 3 s, discrete jumps:
      keyTimes = "0;0.333;0.667"

      Phase 0  shape [3]             3 cells in a row
      Phase 1  shape [1, 3]          same row, dashed bracket above (size-1 outer axis)
      Phase 2  shape [3, 1]          column, dashed bracket on the right (size-1 inner axis)

    All three phases show identical data [1, 2, 3] — only shape changes.
  -->

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Shape badge (3 stacked text elements)                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="260" y="33" width="200" height="28" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>

  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#6f42c1">
    <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [3]
  </text>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#6f42c1">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [1, 3]
  </text>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#6f42c1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [3, 1]
  </text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Phase 1 marker — dashed rect ABOVE the row (size-1 axis-0)-->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <g>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="260" y="80" width="205" height="22" rx="4" fill="#f3edf9" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="362" y="96" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="600">axis-0 · size = 1</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Phase 2 marker — dashed rect to the RIGHT of the column   -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="400" y="110" width="44" height="142" rx="4" fill="#f3edf9" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="500" y="178" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="600">axis-1</text>
    <text x="500" y="194" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="11" font-weight="600">size = 1</text>
    <line x1="445" y1="185" x2="478" y2="185" stroke="#6f42c1" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Data cells — 3 elements that jump between row and column   -->
  <!--                                                            -->
  <!-- Phase 0 (row) & Phase 1 (row): cells at (265,110), (330,110), (395,110) -->
  <!-- Phase 2 (column):              cells at (330,110), (330,159), (330,208) -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="265,110; 265,110; 330,110"
      keyTimes="0;0.333;0.667"
      dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" fill="#ffffff" stroke="#c9b88a" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="16" font-weight="600">1</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="330,110; 330,110; 330,159"
      keyTimes="0;0.333;0.667"
      dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" fill="#ffffff" stroke="#c9b88a" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="16" font-weight="600">2</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="395,110; 395,110; 330,208"
      keyTimes="0;0.333;0.667"
      dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" fill="#ffffff" stroke="#c9b88a" stroke-width="1"/>
    <text x="30" y="28" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="16" font-weight="600">3</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Connecting arrow                                           -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <text x="360" y="278" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">data  (always [1, 2, 3] — unsqueeze never copies)</text>
  <line x1="360" y1="263" x2="360" y2="290" stroke="#a8956a" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="360,290 356,284 364,284" fill="#a8956a"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Persistent flat data strip (centered, static amber)        -->
  <!-- 3 cells, w=60, stride 65, span 265-455                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="265" y="295" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="295" y="318" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">1</text>
  <text x="295" y="348" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[0]</text>

  <rect x="330" y="295" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="360" y="318" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">2</text>
  <text x="360" y="348" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[1]</text>

  <rect x="395" y="295" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="425" y="318" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">3</text>
  <text x="425" y="348" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[2]</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Formula bar — 3 phases                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="30" y="362" width="660" height="28" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>

  <text x="360" y="381" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220">
    <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    starting tensor   ·   shape [3]   ·   3 elements
  </text>
  <text x="360" y="381" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    unsqueeze(t, 0)   →   [3] becomes [1, 3]   ·   size-1 OUTER axis added
  </text>
  <text x="360" y="381" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    unsqueeze(t, 1)   →   [3] becomes [3, 1]   ·   size-1 INNER axis added
  </text>

</svg>
