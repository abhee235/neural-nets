<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">

  <!-- ─── background ─────────────────────────────────────────── -->
  <rect width="720" height="340" fill="#faf7f0" rx="12"/>

  <!-- ─── titles ─────────────────────────────────────────────── -->
  <text x="140" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">A  [2 × 3]</text>
  <text x="540" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">Aᵀ  [3 × 2]</text>

  <!-- ─── A brackets ─────────────────────────────────────────── -->
  <path d="M 40,36 L 33,36 L 33,134 L 40,134" fill="none" stroke="#8b7355" stroke-width="2"/>
  <path d="M 235,36 L 242,36 L 242,134 L 235,134" fill="none" stroke="#8b7355" stroke-width="2"/>

  <!-- ─── Aᵀ brackets ────────────────────────────────────────── -->
  <path d="M 470,36 L 463,36 L 463,183 L 470,183" fill="none" stroke="#8b7355" stroke-width="2"/>
  <path d="M 600,36 L 607,36 L 607,183 L 600,183" fill="none" stroke="#8b7355" stroke-width="2"/>

  <!-- ─── transpose label + arrow + formula ──────────────────── -->
  <text x="365" y="75" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="13" font-weight="600">transpose</text>
  <text x="365" y="92" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="10">Aᵀ[j,i] = A[i,j]</text>
  <line x1="270" y1="108" x2="460" y2="108" stroke="#8b7355" stroke-width="1.5"/>
  <polygon points="460,108 453,104 453,112" fill="#8b7355"/>

  <!--
    Animation timing
    ────────────────
    3 phases × 3 s = 9 s,  keyTimes = "0;0.333;0.667"

      Phase 0 — A row 0 (blue) maps to Aᵀ col 0 (blue)
      Phase 1 — A row 1 (green) maps to Aᵀ col 1 (green)
      Phase 2 — flat strips amber, formula bar says "memory rewrote"

    Colours (matching matmul-animation.svg)
      blue   bg #d6e9f8  text #1e6091
      green  bg #d4ecd5  text #2e7d32
      amber  bg #fff3cd  text #856404
      normal bg #ffffff  text #2c2416
  -->

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- A grid: 2 rows × 3 cols, cells at (45+c*65, 40+r*49)      -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- A[0,0] = 1  (row 0 → blue in phase 0) -->
  <rect x="45" y="40" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="75" y="68" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    1
  </text>

  <!-- A[0,1] = 2 -->
  <rect x="110" y="40" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="140" y="68" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    2
  </text>

  <!-- A[0,2] = 3 -->
  <rect x="175" y="40" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="205" y="68" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    3
  </text>

  <!-- A[1,0] = 4  (row 1 → green in phase 1) -->
  <rect x="45" y="89" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="75" y="117" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    4
  </text>

  <!-- A[1,1] = 5 -->
  <rect x="110" y="89" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="140" y="117" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    5
  </text>

  <!-- A[1,2] = 6 -->
  <rect x="175" y="89" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="205" y="117" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    6
  </text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Aᵀ grid: 3 rows × 2 cols, cells at (470+c*65, 40+r*49)   -->
  <!-- col 0 → blue (came from row 0), col 1 → green (row 1)    -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Aᵀ[0,0] = 1  (col 0 → blue) -->
  <rect x="470" y="40" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="68" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    1
  </text>

  <!-- Aᵀ[0,1] = 4  (col 1 → green) -->
  <rect x="535" y="40" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="565" y="68" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    4
  </text>

  <!-- Aᵀ[1,0] = 2 -->
  <rect x="470" y="89" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="117" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    2
  </text>

  <!-- Aᵀ[1,1] = 5 -->
  <rect x="535" y="89" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="565" y="117" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    5
  </text>

  <!-- Aᵀ[2,0] = 3 -->
  <rect x="470" y="138" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="166" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    3
  </text>

  <!-- Aᵀ[2,1] = 6 -->
  <rect x="535" y="138" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#ffffff" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="565" y="166" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#2c2416" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    6
  </text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Flat memory strips                                        -->
  <!-- A.flat  = [1, 2, 3, 4, 5, 6]                              -->
  <!-- Aᵀ.flat = [1, 4, 2, 5, 3, 6]   (rewritten — different)    -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <text x="45" y="208" fill="#8b7355" font-family="monospace" font-size="11">A.data  (row-major flat memory)</text>
  <text x="475" y="208" fill="#8b7355" font-family="monospace" font-size="11">Aᵀ.data  (row-major flat memory)</text>

  <!-- A flat strip values [1,2,3,4,5,6] — row 0 elements first (blue), then row 1 (green) -->
  <!-- Cell i at x=45+i*36 -->

  <!-- A.flat[0] = 1 -->
  <rect x="45" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="61" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    1
  </text>
  <text x="61" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[0]</text>

  <!-- A.flat[1] = 2 -->
  <rect x="81" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="97" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    2
  </text>
  <text x="97" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[1]</text>

  <!-- A.flat[2] = 3 -->
  <rect x="117" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="133" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    3
  </text>
  <text x="133" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[2]</text>

  <!-- A.flat[3] = 4 -->
  <rect x="153" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="169" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    4
  </text>
  <text x="169" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[3]</text>

  <!-- A.flat[4] = 5 -->
  <rect x="189" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="205" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    5
  </text>
  <text x="205" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[4]</text>

  <!-- A.flat[5] = 6 -->
  <rect x="225" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="241" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    6
  </text>
  <text x="241" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[5]</text>

  <!-- ── Aᵀ flat strip values [1, 4, 2, 5, 3, 6] ── -->
  <!-- col 0 elements first (blue), then col 1 (green) — interleaved with originals -->

  <!-- Aᵀ.flat[0] = 1 -->
  <rect x="475" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="491" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    1
  </text>
  <text x="491" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[0]</text>

  <!-- Aᵀ.flat[1] = 4 -->
  <rect x="511" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="527" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    4
  </text>
  <text x="527" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[1]</text>

  <!-- Aᵀ.flat[2] = 2 -->
  <rect x="547" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="563" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    2
  </text>
  <text x="563" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[2]</text>

  <!-- Aᵀ.flat[3] = 5 -->
  <rect x="583" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="599" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    5
  </text>
  <text x="599" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[3]</text>

  <!-- Aᵀ.flat[4] = 3 -->
  <rect x="619" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#d6e9f8;#ffffff;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="635" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#1e6091;#2c2416;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    3
  </text>
  <text x="635" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[4]</text>

  <!-- Aᵀ.flat[5] = 6 -->
  <rect x="655" y="222" width="32" height="28" rx="3" stroke="#c9b88a" stroke-width="1">
    <animate attributeName="fill" values="#ffffff;#d4ecd5;#fff3cd" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="671" y="241" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600">
    <animate attributeName="fill" values="#2c2416;#2e7d32;#856404" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    6
  </text>
  <text x="671" y="266" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="9">[5]</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Formula bar — 3 phases                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="30" y="290" width="660" height="32" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>

  <!-- Phase 0 -->
  <text x="360" y="311" text-anchor="middle" font-family="monospace" font-size="12" fill="#6f42c1">
    <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    row 0 of A  =  [1, 2, 3]   →   becomes column 0 of Aᵀ
  </text>

  <!-- Phase 1 -->
  <text x="360" y="311" text-anchor="middle" font-family="monospace" font-size="12" fill="#6f42c1">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    row 1 of A  =  [4, 5, 6]   →   becomes column 1 of Aᵀ
  </text>

  <!-- Phase 2 -->
  <text x="360" y="311" text-anchor="middle" font-family="monospace" font-size="12" fill="#6f42c1">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
    flat memory REWROTE:   A=[1,2,3,4,5,6]   ≠   Aᵀ=[1,4,2,5,3,6]
  </text>

</svg>
