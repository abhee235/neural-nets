<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="720" height="410" fill="#faf7f0" rx="12"/>

  <!-- ─── header label ───────────────────────────────────────── -->
  <text x="360" y="22" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">view  (just a shape descriptor)</text>

  <!--
    Animation timing
    ────────────────
    12 s cycle, 4 phases × 3 s, discrete jumps:
      keyTimes = "0;0.25;0.5;0.75"

      Phase 0  shape [2 × 3]        white cells
      Phase 1  shape [3 × 2]        white cells
      Phase 2  shape [6]            white cells
      Phase 3  shape [-1, 2]        amber-tinted cells + inference banner showing
                                    -1 = 6 / 2 = 3   ⇒   inferred [3, 2]

    All four phases share the SAME flat memory [1, 2, 3, 4, 5, 6].
    The amber strip at the bottom never moves — that is the point.
  -->

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Shape badge (4 stacked text elements)                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="220" y="33" width="280" height="28" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>

  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#6f42c1">
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [2 × 3]
  </text>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#6f42c1">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [3 × 2]
  </text>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#6f42c1">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [6]
  </text>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#856404">
    <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    shape: [-1, 2]   (the −1 will be inferred)
  </text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Inference banner — visible ONLY in phase 3                 -->
  <!-- Shows:  reshape(t, [-1, 2])  →  6 / 2 = 3  →  [3, 2]       -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <g>
    <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>

    <!-- banner background -->
    <rect x="80" y="68" width="560" height="32" rx="8" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>

    <!-- step 1: user input -->
    <text x="155" y="89" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#5a3a00">reshape(t, [-1, 2])</text>

    <!-- arrow 1 -->
    <line x1="245" y1="84" x2="278" y2="84" stroke="#856404" stroke-width="1.5"/>
    <polygon points="278,84 272,80 272,88" fill="#856404"/>

    <!-- step 2: the math -->
    <text x="345" y="89" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#5a3a00">
      −1  =  6 ÷ 2  =  <tspan fill="#b00020" font-size="15">3</tspan>
    </text>

    <!-- arrow 2 -->
    <line x1="430" y1="84" x2="463" y2="84" stroke="#856404" stroke-width="1.5"/>
    <polygon points="463,84 457,80 457,88" fill="#856404"/>

    <!-- step 3: inferred result -->
    <text x="545" y="89" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#5a3a00">
      shape = [<tspan fill="#b00020" font-size="15">3</tspan>, 2]
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Grid — 6 cells that jump between 4 layouts (discrete)      -->
  <!--                                                            -->
  <!-- Layout origins (top-left), stride (65, 49):                -->
  <!--   [2 × 3] → (177, 125)                                     -->
  <!--   [3 × 2] → (295, 125)                                     -->
  <!--   [6]     → (50, 125)                                      -->
  <!--   [-1, 2] → (295, 125)  (same as [3 × 2])                 -->
  <!--                                                            -->
  <!-- Cells are WHITE in phases 0-2, AMBER in phase 3.           -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- element 0, value 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="177,125; 295,125; 50,125; 295,125"
      keyTimes="0;0.25;0.5;0.75"
      dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
      <animate attributeName="fill" values="#ffffff;#ffffff;#ffffff;#fff3cd" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9b88a;#c9b88a;#c9b88a;#e0a800" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
      <animate attributeName="fill" values="#2c2416;#2c2416;#2c2416;#856404" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      1
    </text>
  </g>

  <!-- element 1, value 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="242,125; 360,125; 115,125; 360,125"
      keyTimes="0;0.25;0.5;0.75"
      dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
      <animate attributeName="fill" values="#ffffff;#ffffff;#ffffff;#fff3cd" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9b88a;#c9b88a;#c9b88a;#e0a800" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
      <animate attributeName="fill" values="#2c2416;#2c2416;#2c2416;#856404" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      2
    </text>
  </g>

  <!-- element 2, value 3 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="307,125; 295,174; 180,125; 295,174"
      keyTimes="0;0.25;0.5;0.75"
      dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
      <animate attributeName="fill" values="#ffffff;#ffffff;#ffffff;#fff3cd" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9b88a;#c9b88a;#c9b88a;#e0a800" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
      <animate attributeName="fill" values="#2c2416;#2c2416;#2c2416;#856404" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      3
    </text>
  </g>

  <!-- element 3, value 4 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="177,174; 360,174; 245,125; 360,174"
      keyTimes="0;0.25;0.5;0.75"
      dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
      <animate attributeName="fill" values="#ffffff;#ffffff;#ffffff;#fff3cd" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9b88a;#c9b88a;#c9b88a;#e0a800" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
      <animate attributeName="fill" values="#2c2416;#2c2416;#2c2416;#856404" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      4
    </text>
  </g>

  <!-- element 4, value 5 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="242,174; 295,223; 310,125; 295,223"
      keyTimes="0;0.25;0.5;0.75"
      dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
      <animate attributeName="fill" values="#ffffff;#ffffff;#ffffff;#fff3cd" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9b88a;#c9b88a;#c9b88a;#e0a800" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
      <animate attributeName="fill" values="#2c2416;#2c2416;#2c2416;#856404" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      5
    </text>
  </g>

  <!-- element 5, value 6 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="307,174; 360,223; 375,125; 360,223"
      keyTimes="0;0.25;0.5;0.75"
      dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="0" y="0" width="60" height="44" rx="4" stroke="#c9b88a" stroke-width="1">
      <animate attributeName="fill" values="#ffffff;#ffffff;#ffffff;#fff3cd" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#c9b88a;#c9b88a;#c9b88a;#e0a800" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="30" y="28" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600">
      <animate attributeName="fill" values="#2c2416;#2c2416;#2c2416;#856404" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      6
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Connecting arrow + label                                   -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <text x="360" y="292" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">data  (Float64Array — never copied)</text>
  <line x1="360" y1="275" x2="360" y2="302" stroke="#a8956a" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="360,302 356,296 364,296" fill="#a8956a"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Persistent flat memory strip (centered, static amber)      -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="100" y="310" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="130" y="333" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">1</text>
  <text x="130" y="363" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[0]</text>

  <rect x="165" y="310" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="195" y="333" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">2</text>
  <text x="195" y="363" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[1]</text>

  <rect x="230" y="310" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="260" y="333" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">3</text>
  <text x="260" y="363" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[2]</text>

  <rect x="295" y="310" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="325" y="333" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">4</text>
  <text x="325" y="363" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[3]</text>

  <rect x="360" y="310" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="390" y="333" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">5</text>
  <text x="390" y="363" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[4]</text>

  <rect x="425" y="310" width="60" height="36" rx="4" fill="#ffd166" stroke="#e0a800" stroke-width="1.5"/>
  <text x="455" y="333" text-anchor="middle" fill="#5a3a00" font-family="monospace" font-size="16" font-weight="600">6</text>
  <text x="455" y="363" text-anchor="middle" fill="#a8956a" font-family="monospace" font-size="10">[5]</text>

  <text x="510" y="325" fill="#8b5a00" font-family="monospace" font-size="11" font-weight="600">same bytes</text>
  <text x="510" y="340" fill="#8b5a00" font-family="monospace" font-size="11" font-weight="600">every shape</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Formula bar — 4 phases                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <rect x="30" y="378" width="660" height="26" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>

  <text x="360" y="395" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220">
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    reshape(t, [2, 3])      ·      data = [1, 2, 3, 4, 5, 6]
  </text>
  <text x="360" y="395" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    reshape(t, [3, 2])      ·      data = [1, 2, 3, 4, 5, 6]
  </text>
  <text x="360" y="395" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    reshape(t, [6])      ·      flatten — same data, 1-D view
  </text>
  <text x="360" y="395" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#856404">
    <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    −1 means "compute me":  total / product(others) = 6 / 2 = 3
  </text>

</svg>
