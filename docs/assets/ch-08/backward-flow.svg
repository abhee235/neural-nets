<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <!-- ─── header ─────────────────────────────────────────────── -->
  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">backward(): seed L.grad = 1, then flow gradients in REVERSE — one pass fills them all</text>

  <!--
    Same graph as the forward build: L = (a·b) + d,  a=2 b=-3 d=10 → c=-6 L=4.
    Analytic answers: dL/da = b = -3,  dL/db = a = 2,  dL/dc = 1,  dL/dd = 1.
    4 phases × 2.5 s, discrete:  keyTimes "0;0.25;0.5;0.75"
      0  seed L.grad = 1
      1  + distributes: c.grad=1, d.grad=1   (copy)
      2  × distributes: a.grad=-3, b.grad=2  (scale by the other input)
      3  done — every leaf gradient is filled
  -->

  <!-- ─── forward edges (faint, always) ──────────────────────── -->
  <line x1="160" y1="104" x2="320" y2="140" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="160" y1="184" x2="320" y2="152" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="450" y1="146" x2="545" y2="216" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="160" y1="296" x2="545" y2="228" stroke="#d8cdb0" stroke-width="1.4"/>

  <!-- ─── backward gradient arrows (red, appear per phase) ───── -->
  <!-- phase 1: L → c, L → d -->
  <g>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="545" y1="214" x2="452" y2="148" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="452,148 459,148 455,156" fill="#b00020"/>
    <line x1="545" y1="226" x2="162" y2="298" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="162,298 169,294 170,302" fill="#b00020"/>
  </g>
  <!-- phase 2: c → a, c → b -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="320" y1="138" x2="162" y2="106" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="162,106 169,105 166,113" fill="#b00020"/>
    <line x1="320" y1="154" x2="162" y2="186" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="162,186 169,182 170,190" fill="#b00020"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Nodes (data line always; grad line appears at its phase)   -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- a -->
  <rect x="40" y="80" width="120" height="48" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="100" y="101" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">a = 2</text>
  <text x="100" y="120" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    grad = -3
  </text>

  <!-- b -->
  <rect x="40" y="160" width="120" height="48" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="100" y="181" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">b = -3</text>
  <text x="100" y="200" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 2
  </text>

  <!-- d -->
  <rect x="40" y="272" width="120" height="48" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="100" y="293" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">d = 10</text>
  <text x="100" y="312" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1
  </text>

  <!-- c = a·b -->
  <rect x="320" y="120" width="130" height="52" rx="8" fill="#d6e9f8" stroke="#1e6091" stroke-width="1.5"/>
  <text x="385" y="142" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="13" font-weight="700">c = -6  (×)</text>
  <text x="385" y="162" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1
  </text>

  <!-- L = c+d -->
  <rect x="545" y="196" width="130" height="52" rx="8" fill="#d4ecd5" stroke="#2e7d32" stroke-width="2"/>
  <text x="610" y="218" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="13" font-weight="700">L = 4  (+)</text>
  <text x="610" y="238" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">grad = 1</text>
  <text x="610" y="186" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="10" font-weight="700">∂L/∂L = 1 (seed)</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Formula bar (4 phases)                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="30" y="340" width="660" height="50" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="362" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="600">
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    a gradient of a value w.r.t. itself is 1 — so we seed L.grad = 1 and walk backward
  </text>
  <text x="360" y="362" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e7d32" font-weight="600">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    L = c + d  →  + copies L.grad to both:  c.grad += 1,  d.grad += 1
  </text>
  <text x="360" y="362" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e6091" font-weight="600">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    c = a·b  →  × scales by the other:  a.grad += 1·b = -3,  b.grad += 1·a = 2
  </text>
  <text x="360" y="362" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="700">
    <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    done in ONE backward sweep:  dL/da=-3, dL/db=2, dL/dc=1, dL/dd=1  ✓ (matches b, a, 1, 1)
  </text>
  <text x="360" y="380" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b7355">
    each node multiplies the gradient it received by the local rule on each edge, and adds it to its parents
  </text>

</svg>
