<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="800" height="470" fill="#faf7f0" rx="12"/>

  <!-- ─── header ─────────────────────────────────────────────── -->
  <text x="400" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">backward() on f = b·sin(a) + b²  —  watch b, used TWICE, collect its gradient in two deposits</text>

  <!--
    Graph:  u = sin(a),  v = b·u,  w = b²,  f = v + w
    At a = π/2, b = 3:  u = 1, v = 3, w = 9, f = 12.
    Analytic: ∂f/∂a = b·cos(a) = 0,  ∂f/∂b = sin(a) + 2b = 7.
    5 phases × 2.5 s, discrete: keyTimes "0;0.2;0.4;0.6;0.8", dur 12.5s
      0  seed f.grad = 1
      1  + copies: v.grad = 1, w.grad = 1
      2  × scales: u.grad = 1·b = 3, b.grad = 1·u = 1   (first deposit into b)
      3  b² sends 1·2b = 6 → b ACCUMULATES: 1 + 6 = 7
      4  sin gate: a.grad = 3·cos(π/2) = 0 — done
  -->

  <!-- ─── forward edges (faint, always) ──────────────────────── -->
  <line x1="180" y1="90"  x2="240" y2="90"  stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="410" y1="90"  x2="470" y2="152" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="180" y1="264" x2="470" y2="172" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="180" y1="286" x2="240" y2="336" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="640" y1="166" x2="688" y2="230" stroke="#d8cdb0" stroke-width="1.4"/>
  <line x1="410" y1="346" x2="630" y2="262" stroke="#d8cdb0" stroke-width="1.4"/>

  <!-- ─── backward gradient arrows (red, appear per phase) ───── -->
  <!-- phase 1: f → v, f → w -->
  <g>
    <animate attributeName="opacity" values="0;1;1;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="680" y1="228" x2="648" y2="176" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="648,176 656,177 650,184" fill="#b00020"/>
    <line x1="632" y1="268" x2="418" y2="344" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="418,344 425,339 427,347" fill="#b00020"/>
  </g>
  <!-- phase 2: v → u (×b), v → b (×u) -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="470" y1="150" x2="416" y2="96" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="416,96 424,97 418,104" fill="#b00020"/>
    <text x="452" y="116" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="10" font-weight="700">×b = ×3</text>
    <line x1="470" y1="176" x2="186" y2="264" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="186,264 193,259 195,267" fill="#b00020"/>
    <text x="330" y="212" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="10" font-weight="700">×u = ×1</text>
  </g>
  <!-- phase 3: w → b (×2b) -->
  <g>
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="240" y1="332" x2="186" y2="292" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="186,292 194,292 190,300" fill="#b00020"/>
    <text x="228" y="320" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="10" font-weight="700">×2b = ×6</text>
  </g>
  <!-- phase 4: u → a (×cos a) -->
  <g>
    <animate attributeName="opacity" values="0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="240" y1="96" x2="186" y2="96" stroke="#b00020" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="186,96 194,92 194,100" fill="#b00020"/>
    <text x="213" y="112" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="10" font-weight="700">×cos(a) = ×0</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Nodes                                                       -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- a -->
  <rect x="30" y="64" width="150" height="52" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="105" y="86" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">a = π/2</text>
  <text x="105" y="106" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 3·0 = 0
  </text>

  <!-- u = sin(a) -->
  <rect x="240" y="64" width="170" height="52" rx="8" fill="#d6e9f8" stroke="#1e6091" stroke-width="1.5"/>
  <text x="325" y="86" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="13" font-weight="700">u = sin(a) = 1</text>
  <text x="325" y="106" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1·b = 3
  </text>

  <!-- v = b·u -->
  <rect x="470" y="140" width="170" height="52" rx="8" fill="#d6e9f8" stroke="#1e6091" stroke-width="1.5"/>
  <text x="555" y="162" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="13" font-weight="700">v = b·u = 3 (×)</text>
  <text x="555" y="182" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;1;1;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1
  </text>

  <!-- b (used twice!) -->
  <rect x="30" y="250" width="150" height="52" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="2.5"/>
  <text x="105" y="272" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">b = 3</text>
  <!-- b's grad, phase 2 only: first deposit -->
  <text x="105" y="292" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1
  </text>
  <!-- b's grad, phases 3+: accumulated -->
  <text x="105" y="292" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1 + 6 = 7
  </text>
  <text x="105" y="322" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="9" font-style="italic">b feeds TWO nodes → its gradients ADD</text>

  <!-- w = b² -->
  <rect x="240" y="320" width="170" height="52" rx="8" fill="#d6e9f8" stroke="#1e6091" stroke-width="1.5"/>
  <text x="325" y="342" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="13" font-weight="700">w = b² = 9</text>
  <text x="325" y="362" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">
    <animate attributeName="opacity" values="0;1;1;1;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    grad = 1
  </text>

  <!-- f = v + w -->
  <rect x="630" y="230" width="150" height="56" rx="8" fill="#d4ecd5" stroke="#2e7d32" stroke-width="2"/>
  <text x="705" y="252" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="13" font-weight="700">f = 12  (+)</text>
  <text x="705" y="272" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">grad = 1</text>
  <text x="705" y="222" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="10" font-weight="700">∂f/∂f = 1 (seed)</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Formula bar (5 phases)                                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="30" y="398" width="740" height="52" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="600">
    <animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    seed:  ∂f/∂f = 1  —  then walk the graph in reverse, one node at a time
  </text>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e7d32" font-weight="600">
    <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    f = v + w  →  + copies the gradient:  v.grad += 1,  w.grad += 1
  </text>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e6091" font-weight="600">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    v = b·u  →  × scales by the OTHER input:  u.grad += 1·b = 3,  b.grad += 1·u = 1
  </text>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#b00020" font-weight="700">
    <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    w = b²  →  sends 1·2b = 6 to b, which ALREADY holds 1  →  accumulate: b.grad = 1 + 6 = 7
  </text>
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="700">
    <animate attributeName="opacity" values="0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8" dur="12.5s" calcMode="discrete" repeatCount="indefinite"/>
    u = sin(a)  →  a.grad += 3·cos(π/2) = 0.   Final: ∂f/∂a = 0, ∂f/∂b = 7  ✓ = b·cos(a), sin(a)+2b
  </text>
  <text x="400" y="440" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b7355">
    a value used in several places receives a gradient from EACH child — += sums its total influence
  </text>

</svg>
