<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">

  <rect width="880" height="470" fill="#faf7f0" rx="12"/>
  <text x="440" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">Run 1 · step 1 of 4 — solve  u = sin(a):  what pair sits on this node?</text>

  <!-- forward edges -->
  <g stroke="#b8a87e" stroke-width="1.8" fill="#b8a87e">
    <line x1="175" y1="90"  x2="226" y2="90"/>  <polygon points="228,90 219,86 219,94"/>
    <line x1="410" y1="95"  x2="466" y2="147"/> <polygon points="468,148 458,146 463,139"/>
    <line x1="175" y1="262" x2="466" y2="171"/> <polygon points="468,170 460,177 458,169"/>
    <line x1="175" y1="288" x2="226" y2="331"/> <polygon points="228,332 218,330 223,323"/>
    <line x1="680" y1="168" x2="716" y2="226"/> <polygon points="718,228 709,224 716,218"/>
    <line x1="410" y1="346" x2="636" y2="263"/> <polygon points="638,262 631,269 628,261"/>
  </g>

  <!-- input a — ACTIVE, seeded -->
  <rect x="25" y="64" width="150" height="52" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="100" y="86" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">a = (a, 1)</text>
  <text x="100" y="106" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="10" font-weight="700">da/da = 1</text>
  <text x="100" y="56" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="9" font-weight="700">ACTIVE — asking ∂f/∂a</text>

  <!-- input b — FROZEN, seeded -->
  <rect x="25" y="250" width="150" height="52" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="272" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="13" font-weight="700">b = (b, 0)</text>
  <text x="100" y="292" text-anchor="middle" fill="#757575" font-family="monospace" font-size="10" font-weight="700">db/da = 0</text>
  <text x="100" y="242" text-anchor="middle" fill="#757575" font-family="monospace" font-size="9" font-style="italic">FROZEN</text>

  <!-- u — SOLVING NOW (amber + ? badge) -->
  <rect x="230" y="64" width="180" height="52" rx="8" fill="#fff3cd" stroke="#e0a800" stroke-width="2.5"/>
  <text x="320" y="86" text-anchor="middle" fill="#856404" font-family="monospace" font-size="13" font-weight="700">u = sin(a)</text>
  <text x="320" y="106" text-anchor="middle" fill="#b00020" font-family="monospace" font-size="11" font-weight="700">(sin a, cos a)</text>
  <circle cx="410" cy="64" r="12" fill="#e0a800"/>
  <text x="410" y="69" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700">?</text>
  <text x="320" y="132" text-anchor="middle" fill="#856404" font-family="monospace" font-size="9" font-weight="700">◄ solving this node now</text>

  <!-- v — not yet -->
  <rect x="470" y="140" width="210" height="52" rx="8" fill="#f4f0e6" stroke="#b0a689" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="575" y="162" text-anchor="middle" fill="#9e9483" font-family="monospace" font-size="13" font-weight="700">v = b · u</text>
  <text x="575" y="182" text-anchor="middle" fill="#9e9483" font-family="monospace" font-size="11" font-weight="700">( ? , ? )</text>

  <!-- w — not yet -->
  <rect x="230" y="320" width="180" height="52" rx="8" fill="#f4f0e6" stroke="#b0a689" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="320" y="342" text-anchor="middle" fill="#9e9483" font-family="monospace" font-size="13" font-weight="700">w = b · b</text>
  <text x="320" y="362" text-anchor="middle" fill="#9e9483" font-family="monospace" font-size="11" font-weight="700">( ? , ? )</text>

  <!-- f — not yet -->
  <rect x="640" y="230" width="220" height="56" rx="8" fill="#f4f0e6" stroke="#b0a689" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="750" y="252" text-anchor="middle" fill="#9e9483" font-family="monospace" font-size="13" font-weight="700">f = v + w</text>
  <text x="750" y="272" text-anchor="middle" fill="#9e9483" font-family="monospace" font-size="11" font-weight="700">( ? , ? )</text>

  <!-- rule panel -->
  <rect x="30" y="396" width="820" height="58" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="440" y="418" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="700">Remember the chain rule for sin (Step 2)?   sin((u, u̇)) = (sin u,  cos u · u̇)</text>
  <text x="440" y="440" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e6091" font-weight="600">apply to a = (a, 1):   value = sin a      derivative = cos a · 1 = cos a      →  u = (sin a, cos a)</text>

</svg>
