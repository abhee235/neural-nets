<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">

  <rect width="720" height="430" fill="#faf7f0" rx="12"/>

  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">matMul backward: don't memorise the transposes — only one arrangement fits</text>

  <!--
    A = [[1,2],[3,4]]   B = [[5,6],[7,8]]   Z = A@B = [[19,22],[43,50]]
    L = sum(Z) = 134,  dZ = ones([2,2])
    dA = dZ @ Bt = [[11,15],[11,15]]        dB = At @ dZ = [[4,4],[6,6]]
    Hand check: dA[0][0] = B[0][0]+B[0][1] = 11.  dB[1][1] = A[0][1]+A[1][1] = 6.
    All values computed with the course's own linalg.
  -->

  <!-- ═══════ FORWARD ROW ═══════════════════════════════════════ -->
  <text x="40" y="56" fill="#1e6091" font-family="monospace" font-size="12" font-weight="700">forward</text>

  <g font-family="monospace" font-size="12" text-anchor="middle">
    <!-- A -->
    <rect x="96"  y="46" width="76" height="52" rx="5" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
    <text x="134" y="64" fill="#6f42c1" font-weight="700">A  [2,2]</text>
    <text x="134" y="80" fill="#2c2416">1  2</text>
    <text x="134" y="93" fill="#2c2416">3  4</text>

    <text x="188" y="76" fill="#8b7355" font-size="14">@</text>

    <!-- B -->
    <rect x="204" y="46" width="76" height="52" rx="5" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
    <text x="242" y="64" fill="#6f42c1" font-weight="700">B  [2,2]</text>
    <text x="242" y="80" fill="#2c2416">5  6</text>
    <text x="242" y="93" fill="#2c2416">7  8</text>

    <text x="296" y="76" fill="#8b7355" font-size="14">=</text>

    <!-- Z -->
    <rect x="312" y="46" width="80" height="52" rx="5" fill="#ffffff" stroke="#1e6091" stroke-width="1.5"/>
    <text x="352" y="64" fill="#1e6091" font-weight="700">Z  [2,2]</text>
    <text x="352" y="80" fill="#2c2416">19  22</text>
    <text x="352" y="93" fill="#2c2416">43  50</text>

    <text x="424" y="70" fill="#2e7d32" font-weight="700" text-anchor="start">L = sum(Z) = 134</text>
    <text x="424" y="88" fill="#a94442" text-anchor="start" font-size="11">so Z.grad = all ones, [2,2]</text>
  </g>

  <line x1="30" y1="112" x2="690" y2="112" stroke="#e0d9c5" stroke-width="1"/>

  <!-- ═══════ dA DERIVATION ════════════════════════════════════ -->
  <text x="40" y="140" fill="#a94442" font-family="monospace" font-size="12" font-weight="700">A.grad — what shape must it be?</text>

  <rect x="36" y="152" width="316" height="118" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1"/>
  <text x="52" y="172" fill="#2c2416" font-family="monospace" font-size="11">must match A, so it must be <tspan fill="#6f42c1" font-weight="700">[2,3]→[2,2]</tspan></text>
  <text x="52" y="190" fill="#8b7355" font-family="monospace" font-size="10">start from dZ [2,2]. to land on [2,2] you must</text>
  <text x="52" y="204" fill="#8b7355" font-family="monospace" font-size="10">multiply by something shaped [2,2] on the right.</text>
  <text x="52" y="222" fill="#2c2416" font-family="monospace" font-size="11">the only such thing in the graph is <tspan fill="#a94442" font-weight="700">Bᵀ</tspan></text>
  <text x="194" y="248" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="14" font-weight="700">A.grad = Z.grad @ Bᵀ</text>
  <text x="194" y="263" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="10">[2,2] @ [2,2] → [2,2] ✓</text>

  <!-- dA values -->
  <rect x="368" y="164" width="86" height="52" rx="5" fill="#ffffff" stroke="#a94442" stroke-width="1.5"/>
  <text x="411" y="182" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="11" font-weight="700">A.grad</text>
  <text x="411" y="197" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="12">11  15</text>
  <text x="411" y="210" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="12">11  15</text>
  <text x="470" y="184" fill="#8b7355" font-family="monospace" font-size="10">check by hand:</text>
  <text x="470" y="198" fill="#8b7355" font-family="monospace" font-size="10">A.grad[0][0] = B[0][0] + B[0][1]</text>
  <text x="470" y="211" fill="#8b7355" font-family="monospace" font-size="10">            = 5 + 6 = 11 ✓</text>

  <!-- ═══════ dB DERIVATION ════════════════════════════════════ -->
  <text x="40" y="296" fill="#a94442" font-family="monospace" font-size="12" font-weight="700">B.grad — same question, other side</text>

  <rect x="36" y="308" width="316" height="76" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1"/>
  <text x="52" y="328" fill="#8b7355" font-family="monospace" font-size="10">must match B. from dZ [2,2] the only way is to be</text>
  <text x="52" y="342" fill="#8b7355" font-family="monospace" font-size="10">multiplied INTO, from the left, by <tspan fill="#a94442" font-weight="700">Aᵀ</tspan></text>
  <text x="194" y="364" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="14" font-weight="700">B.grad = Aᵀ @ Z.grad</text>
  <text x="194" y="378" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="10">[2,2] @ [2,2] → [2,2] ✓</text>

  <rect x="368" y="312" width="86" height="52" rx="5" fill="#ffffff" stroke="#a94442" stroke-width="1.5"/>
  <text x="411" y="330" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="11" font-weight="700">B.grad</text>
  <text x="411" y="345" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="12">4  4</text>
  <text x="411" y="358" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="12">6  6</text>
  <text x="470" y="332" fill="#8b7355" font-family="monospace" font-size="10">check by hand:</text>
  <text x="470" y="346" fill="#8b7355" font-family="monospace" font-size="10">B.grad[1][1] = A[0][1] + A[1][1]</text>
  <text x="470" y="359" fill="#8b7355" font-family="monospace" font-size="10">            = 2 + 4 = 6 ✓</text>

  <!-- alternating highlight between the two derivations -->
  <rect x="32" y="148" width="324" height="126" rx="9" fill="none" stroke="#a94442" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0.9;0.9;0;0" keyTimes="0;0.45;0.5;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="32" y="304" width="324" height="84" rx="9" fill="none" stroke="#a94442" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══════ formula bar ══════════════════════════════════════ -->
  <rect x="30" y="396" width="660" height="24" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="412" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220" font-weight="600">
    unsure in a later chapter? write the four shapes down and the transposes reassemble themselves
  </text>

</svg>
