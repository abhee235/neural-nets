<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">

  <rect width="720" height="440" fill="#faf7f0" rx="12"/>

  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">Chapter 08's graph L = (a·b) + d, with tensors — three gradients unchanged, one different</text>

  <!--
    Ch 08 scalar:  a=2, b=-3, d=10  ->  c=-6, L=4
                   grads: c=1, a=-3, b=2, d=1
    Ch 10 tensor:  A,B are [2,3] of 2 and -3;  d is [1,3] of 10, broadcast.
                   C = -6 everywhere, Z = 4 everywhere, L = sum(Z) = 24
                   grads: C=1, A=-3, B=2  (identical)   d = [2,2,2]  (summed)
    All values produced by the course's own tensor library.
  -->

  <!-- ══════ column headers ══════════════════════════════════════ -->
  <rect x="30" y="40" width="316" height="26" rx="6" fill="#eceff4" stroke="#8fa3bf"/>
  <text x="188" y="58" text-anchor="middle" fill="#3d5a80" font-family="monospace" font-size="12" font-weight="700">Ch 08 — one number per node</text>

  <rect x="374" y="40" width="316" height="26" rx="6" fill="#f0f6f0" stroke="#2e7d32"/>
  <text x="532" y="58" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="12" font-weight="700">Ch 10 — one [2,3] per node</text>

  <line x1="360" y1="72" x2="360" y2="330" stroke="#e0d9c5" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ══════ LEFT: the scalar version ════════════════════════════ -->
  <g font-family="monospace" text-anchor="middle">
    <text x="70"  y="96" fill="#6f42c1" font-size="11" font-weight="700">a</text>
    <rect x="46" y="102" width="48" height="26" rx="4" fill="#ffffff" stroke="#6f42c1"/>
    <text x="70"  y="120" fill="#2c2416" font-size="12">2</text>

    <text x="140" y="96" fill="#6f42c1" font-size="11" font-weight="700">b</text>
    <rect x="116" y="102" width="48" height="26" rx="4" fill="#ffffff" stroke="#6f42c1"/>
    <text x="140" y="120" fill="#2c2416" font-size="12">-3</text>

    <text x="250" y="96" fill="#6f42c1" font-size="11" font-weight="700">d</text>
    <rect x="226" y="102" width="48" height="26" rx="4" fill="#ffffff" stroke="#a94442" stroke-width="1.5"/>
    <text x="250" y="120" fill="#2c2416" font-size="12">10</text>

    <text x="105" y="150" fill="#8b7355" font-size="11">c = a×b = -6</text>
    <text x="188" y="168" fill="#3d5a80" font-size="12" font-weight="700">L = c + d = 4</text>
  </g>

  <text x="188" y="196" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="11" font-weight="700">backward</text>
  <g font-family="monospace" font-size="12" text-anchor="start" fill="#2c2416">
    <text x="72" y="218">c.grad = 1</text>
    <text x="72" y="238">a.grad = -3</text>
    <text x="72" y="258">b.grad = 2</text>
    <text x="72" y="278" fill="#a94442" font-weight="700">d.grad = 1</text>
  </g>

  <!-- ══════ RIGHT: the tensor version ═══════════════════════════ -->
  <g font-family="monospace" text-anchor="middle">
    <text x="424" y="96" fill="#6f42c1" font-size="11" font-weight="700">A [2,3]</text>
    <rect x="392" y="102" width="64" height="26" rx="4" fill="#ffffff" stroke="#6f42c1"/>
    <text x="424" y="120" fill="#2c2416" font-size="11">all 2</text>

    <text x="500" y="96" fill="#6f42c1" font-size="11" font-weight="700">B [2,3]</text>
    <rect x="468" y="102" width="64" height="26" rx="4" fill="#ffffff" stroke="#6f42c1"/>
    <text x="500" y="120" fill="#2c2416" font-size="11">all -3</text>

    <text x="614" y="96" fill="#a94442" font-size="11" font-weight="700">d [1,3]  ← one row</text>
    <rect x="576" y="102" width="76" height="26" rx="4" fill="#ffffff" stroke="#a94442" stroke-width="2"/>
    <text x="614" y="120" fill="#2c2416" font-size="11">10 10 10</text>

    <text x="462" y="150" fill="#8b7355" font-size="11">C = A×B = all -6</text>
    <text x="532" y="168" fill="#2e7d32" font-size="12" font-weight="700">Z = C + d = all 4    L = sum(Z) = 24</text>
  </g>

  <!-- the broadcast arrow, animated -->
  <path d="M614,130 L614,144" stroke="#a94442" stroke-width="1.5" stroke-dasharray="3 3">
    <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <text x="668" y="142" fill="#a94442" font-family="monospace" font-size="9">copied into</text>
  <text x="668" y="152" fill="#a94442" font-family="monospace" font-size="9">both rows</text>

  <text x="532" y="196" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="11" font-weight="700">backward</text>
  <g font-family="monospace" font-size="12" text-anchor="start" fill="#2c2416">
    <text x="404" y="218">C.grad = every entry 1</text>
    <text x="404" y="238">A.grad = every entry -3</text>
    <text x="404" y="258">B.grad = every entry 2</text>
    <text x="404" y="278" fill="#a94442" font-weight="700">d.grad = [ 2  2  2 ]</text>
  </g>

  <!-- "same" ticks -->
  <g font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">
    <text x="366" y="218" fill="#2e7d32">=</text>
    <text x="366" y="238" fill="#2e7d32">=</text>
    <text x="366" y="258" fill="#2e7d32">=</text>
    <text x="366" y="278" fill="#a94442">≠</text>
  </g>

  <!-- the one-difference highlight, pulsing -->
  <rect x="66" y="264" width="596" height="24" rx="5" fill="none" stroke="#a94442" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="360" y="308" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="12" font-weight="700">three gradients identical — one changed</text>
  <text x="360" y="324" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="10">and that single difference is what Chapter 10 is about</text>

  <!-- ══════ the why ═════════════════════════════════════════════ -->
  <rect x="30" y="340" width="660" height="54" rx="8" fill="#ffffff" stroke="#a94442" stroke-width="1.5"/>
  <text x="360" y="358" text-anchor="middle" fill="#a94442" font-family="monospace" font-size="11" font-weight="700">why only d?  because only d was shared</text>
  <text x="360" y="374" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="11">A, B and C had their own gradient slot per element — nothing to merge</text>
  <text x="360" y="388" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="11">d was ONE row used in TWO rows, so its gradient is 1 + 1 = 2</text>

  <!-- formula bar -->
  <rect x="30" y="404" width="660" height="26" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="421" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220" font-weight="600">
    Ch 08's rule, unchanged: a value used in several places collects the SUM of their gradients
  </text>

</svg>
