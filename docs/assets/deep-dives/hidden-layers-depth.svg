<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372">
  <rect width="720" height="372" fill="#faf7f0" rx="12"/>
  <text x="360" y="26" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">does depth help? it depends entirely on the problem</text>
  <line x1="352" y1="52" x2="352" y2="330" stroke="#c9b88a" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="44" y="66" font-family="monospace" font-size="9.5" font-weight="700" fill="#5a4220">a simple 1-D curve, sin(3x)</text>
  <text x="44" y="80" font-family="monospace" font-size="8" fill="#8b7355">same parameter budget (~50). longer bar is better.</text>
<text x="44" y="108" font-family="monospace" font-size="9" font-weight="700" fill="#2c2416">1 hidden  [16]</text>
<text x="304" y="108" text-anchor="end" font-family="monospace" font-size="7.5" fill="#8b7355">49 params</text>
<rect x="44" y="115" width="260" height="16" rx="3" fill="#ede7d3"/>
<rect x="44" y="115" width="260.0" height="16" rx="3" fill="#2e7d32" opacity="0.9"/>
<text x="44" y="146" font-family="monospace" font-size="9" font-weight="700" fill="#2e7d32">loss 0.000058</text>
<text x="44" y="170" font-family="monospace" font-size="9" font-weight="700" fill="#2c2416">2 hidden  [5, 5]</text>
<text x="304" y="170" text-anchor="end" font-family="monospace" font-size="7.5" fill="#8b7355">46 params</text>
<rect x="44" y="177" width="260" height="16" rx="3" fill="#ede7d3"/>
<rect x="44" y="177" width="20.8" height="16" rx="3" fill="#a94442" opacity="0.9"/>
<text x="44" y="208" font-family="monospace" font-size="9" font-weight="700" fill="#a94442">loss 0.023003</text>
<text x="44" y="232" font-family="monospace" font-size="9" font-weight="700" fill="#2c2416">3 hidden  [4, 4, 4]</text>
<text x="304" y="232" text-anchor="end" font-family="monospace" font-size="7.5" fill="#8b7355">53 params</text>
<rect x="44" y="239" width="260" height="16" rx="3" fill="#ede7d3"/>
<rect x="44" y="239" width="109.5" height="16" rx="3" fill="#a94442" opacity="0.9"/>
<text x="44" y="270" font-family="monospace" font-size="9" font-weight="700" fill="#a94442">loss 0.002499</text>
  <text x="44" y="308" font-family="monospace" font-size="8.5" font-weight="700" fill="#a94442">one WIDE layer wins, by 40&#215;</text>
  <text x="44" y="322" font-family="monospace" font-size="8" fill="#8b7355">splitting the same budget into narrow layers</text>
  <text x="44" y="334" font-family="monospace" font-size="8" fill="#8b7355">makes it harder to train, not more capable.</text>

  <text x="400" y="66" font-family="monospace" font-size="9.5" font-weight="700" fill="#5a4220">MNIST digits, 2,000 images</text>
  <text x="400" y="80" font-family="monospace" font-size="8" fill="#8b7355">medians of 5 runs. longer bar is better.</text>
<text x="400" y="108" font-family="monospace" font-size="9" font-weight="700" fill="#2c2416">no hidden  784&#8594;10</text>
<text x="676" y="108" text-anchor="end" font-family="monospace" font-size="7.5" fill="#8b7355">7,850 params</text>
<rect x="400" y="115" width="276" height="16" rx="3" fill="#ede7d3"/>
<rect x="400" y="115" width="65.2" height="16" rx="3" fill="#1e6091" opacity="0.9"/>
<text x="400" y="146" font-family="monospace" font-size="9" font-weight="700" fill="#1e6091">test accuracy 87.8%</text>
<text x="400" y="170" font-family="monospace" font-size="9" font-weight="700" fill="#2c2416">1 hidden   784&#8594;128&#8594;10</text>
<text x="676" y="170" text-anchor="end" font-family="monospace" font-size="7.5" fill="#8b7355">101,770 params</text>
<rect x="400" y="177" width="276" height="16" rx="3" fill="#ede7d3"/>
<rect x="400" y="177" width="165.6" height="16" rx="3" fill="#1e6091" opacity="0.9"/>
<text x="400" y="208" font-family="monospace" font-size="9" font-weight="700" fill="#1e6091">test accuracy 89.8%</text>
<text x="400" y="232" font-family="monospace" font-size="9" font-weight="700" fill="#2c2416">3 hidden   784&#8594;..&#8594;10</text>
<text x="676" y="232" text-anchor="end" font-family="monospace" font-size="7.5" fill="#8b7355">111,146 params</text>
<rect x="400" y="239" width="276" height="16" rx="3" fill="#ede7d3"/>
<rect x="400" y="239" width="235.9" height="16" rx="3" fill="#2e7d32" opacity="0.9"/>
<text x="400" y="270" font-family="monospace" font-size="9" font-weight="700" fill="#2e7d32">test accuracy 91.2%</text>
  <text x="400" y="308" font-family="monospace" font-size="8.5" font-weight="700" fill="#2e7d32">here depth DOES help, by 1.4 points</text>
  <text x="400" y="322" font-family="monospace" font-size="8" fill="#8b7355">an image is built from parts made of parts,</text>
  <text x="400" y="334" font-family="monospace" font-size="8" fill="#8b7355">and layers can build on layers.</text>

  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#5a4220">depth pays when the data has structure to compose. on a plain curve it costs you.</text>
</svg>
