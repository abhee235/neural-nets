  <text x="360" y="26" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">one unit is one bend &#8212; and the Linear decides everything about it</text>
  <text x="360" y="44" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="8.5">relu supplies the corner. w and b choose where it sits, which way it faces, and how steep it leaves.</text>
