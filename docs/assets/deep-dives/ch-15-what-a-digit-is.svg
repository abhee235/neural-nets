  <text x="342" y="309" font-family="monospace" font-size="9" font-weight="700" fill="#a94442">SCALING &#8212; why every value is divided by 255</text>
  <text x="342" y="326" font-family="monospace" font-size="8.5" fill="#5a4220">stored  0 &#8230; 255      &#8594;      used  0.0 &#8230; 1.0</text>
  <text x="342" y="342" font-family="monospace" font-size="8.5" fill="#5a4220">Ch 13 chose the init scale assuming inputs near 1.</text>
  <text x="342" y="356" font-family="monospace" font-size="8.5" fill="#5a4220">Feed raw bytes and the first pre-activations are ~255&#215;</text>
  <text x="342" y="370" font-family="monospace" font-size="8.5" fill="#5a4220">too big &#8212; straight into the flat tail of everything after.</text>
