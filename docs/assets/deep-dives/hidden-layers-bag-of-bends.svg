  <text x="90" y="228" font-family="monospace" font-size="8.5" fill="#5a4220">the Linear chooses <tspan font-weight="700">where</tspan> the bend goes (b₁/w₁) and <tspan font-weight="700">how steep</tspan> it is (w₁). relu supplies the bend itself.</text>
  <text x="90" y="242" font-family="monospace" font-size="8.5" fill="#a94442">unit 1's kink is at x = 3.91 &#8212; outside the data, so it never bends here. its output weight is &#8722;0.04. it does nothing.</text>
  <text x="360" y="266" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#8b7355">&#8595;  the next layer adds them up  &#8595;</text>
<text x="90" y="284" font-family="monospace" font-size="9.5" font-weight="700" fill="#5a4220">their weighted sum is the curve</text>
<text x="90" y="296" font-family="monospace" font-size="8" fill="#8b7355">five working hinges, joined end to end, become a sine wave</text>
