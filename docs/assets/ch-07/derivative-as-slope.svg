<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="720" height="400" fill="#faf7f0" rx="12"/>

  <!-- ─── header ─────────────────────────────────────────────── -->
  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">the derivative is the slope you reach as the nudge h shrinks to zero</text>

  <!--
    f(x) = x²,  point P = (2, 4).  4 phases × 2.5 s, discrete:
      h = 1   → secant slope 5      keyTimes 0;0.25;0.5;0.75
      h = 0.5 → secant slope 4.5
      h = 0.25→ secant slope 4.25
      h → 0   → the tangent, slope 4 = f'(2)
  -->

  <!-- ─── parabola f(x)=x² (static) ──────────────────────────── -->
  <path d="M80.0,320.0 L94.0,319.7 L108.0,319.0 L122.0,317.7 L136.0,315.8 L150.0,313.5 L164.0,310.6 L178.0,307.3 L192.0,303.4 L206.0,298.9 L220.0,294.0 L234.0,288.5 L248.0,282.6 L262.0,276.1 L276.0,269.0 L290.0,261.5 L304.0,253.4 L318.0,244.9 L332.0,235.8 L346.0,226.1 L360.0,216.0 L374.0,205.3 L388.0,194.2 L402.0,182.5 L416.0,170.2 L430.0,157.5 L444.0,144.2 L458.0,130.5 L472.0,116.2 L486.0,101.3 L500.0,86.0 L514.0,70.1 L528.0,53.8"
        fill="none" stroke="#c9b88a" stroke-width="2"/>
  <text x="120" y="300" fill="#a8956a" font-family="monospace" font-size="12" font-weight="700">f(x) = x²</text>

  <!-- ─── tangent line (limit), visible only in last phase ───── -->
  <g>
    <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    <line x1="276.0" y1="278.4" x2="500.0" y2="112.0" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="470" y="150" fill="#2e7d32" font-family="monospace" font-size="12" font-weight="700">tangent</text>
  </g>

  <!-- ─── secant (phases 0–2): run + rise + line + moving Q ──── -->
  <g>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>

    <!-- run (horizontal, = h) -->
    <line x1="360.0" y1="216.0" y2="216.0" stroke="#856404" stroke-width="1.2" stroke-dasharray="4,3">
      <animate attributeName="x2" values="500.0;430.0;395.0;395.0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    </line>
    <!-- rise (vertical, = Δf) -->
    <line y1="216.0" stroke="#856404" stroke-width="1.2" stroke-dasharray="4,3">
      <animate attributeName="x1" values="500.0;430.0;395.0;395.0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500.0;430.0;395.0;395.0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y2" values="86.0;157.5;188.4;188.4" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    </line>

    <!-- secant line P→Q -->
    <line x1="360.0" y1="216.0" stroke="#1e6091" stroke-width="2.5">
      <animate attributeName="x2" values="500.0;430.0;395.0;395.0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y2" values="86.0;157.5;188.4;188.4" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    </line>

    <!-- moving point Q -->
    <circle r="5" fill="#1e6091">
      <animate attributeName="cx" values="500.0;430.0;395.0;395.0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="cy" values="86.0;157.5;188.4;188.4" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <text x="515" y="80" fill="#1e6091" font-family="monospace" font-size="11" font-weight="700">Q = (2+h, f(2+h))</text>
  </g>

  <!-- ─── fixed point P ──────────────────────────────────────── -->
  <circle cx="360.0" cy="216.0" r="6" fill="#b00020"/>
  <text x="335" y="212" text-anchor="end" fill="#b00020" font-family="monospace" font-size="12" font-weight="700">P = (2, 4)</text>

  <!-- ─── formula bar (4 phases) ─────────────────────────────── -->
  <rect x="30" y="338" width="660" height="50" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="600">
    <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    h = 1.0:  slope = (f(3) − f(2)) / 1 = (9 − 4) / 1 = 5.00
  </text>
  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="600">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    h = 0.5:  slope = (f(2.5) − f(2)) / 0.5 = (6.25 − 4) / 0.5 = 4.50
  </text>
  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a4220" font-weight="600">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    h = 0.25:  slope = (f(2.25) − f(2)) / 0.25 = (5.0625 − 4) / 0.25 = 4.25
  </text>
  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e7d32" font-weight="700">
    <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
    h → 0:  slope settles at the tangent = f′(2) = 4.00  ← the derivative
  </text>
  <text x="360" y="379" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b7355">
    rise ÷ run = Δf ÷ h ; as the run h shrinks, the secant rotates into the tangent
  </text>

</svg>
