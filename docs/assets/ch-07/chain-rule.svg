<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">

  <!-- ─── background (light cream) ───────────────────────────── -->
  <rect width="720" height="360" fill="#faf7f0" rx="12"/>

  <!-- ─── header ─────────────────────────────────────────────── -->
  <text x="360" y="24" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="600">the chain rule: a nudge is AMPLIFIED by each stage — multiply the local rates</text>

  <!--
    Pipeline  x → g → u → f → y.  Local rates: du/dx = 2, dy/du = 3.
    A nudge of size δ at x becomes 2δ at u and 6δ at y → dy/dx = 3·2 = 6.
    3 phases × 2.5 s, discrete:  keyTimes "0;0.333;0.667"
  -->

  <!-- ─── nodes ──────────────────────────────────────────────── -->
  <rect x="55" y="120" width="70" height="44" rx="8" fill="#ffffff" stroke="#c9b88a" stroke-width="1.5"/>
  <text x="90" y="148" text-anchor="middle" fill="#2c2416" font-family="monospace" font-size="16" font-weight="700">x</text>

  <rect x="325" y="120" width="70" height="44" rx="8" fill="#d6e9f8" stroke="#1e6091" stroke-width="1.5"/>
  <text x="360" y="148" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="16" font-weight="700">u = g(x)</text>

  <rect x="595" y="120" width="70" height="44" rx="8" fill="#d4ecd5" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="630" y="148" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="16" font-weight="700">y = f(u)</text>

  <!-- ─── arrows with local rates ────────────────────────────── -->
  <line x1="125" y1="142" x2="323" y2="142" stroke="#8b7355" stroke-width="1.5"/>
  <polygon points="323,142 316,138 316,146" fill="#8b7355"/>
  <text x="224" y="132" text-anchor="middle" fill="#1e6091" font-family="monospace" font-size="12" font-weight="700">g: du/dx = 2</text>

  <line x1="395" y1="142" x2="593" y2="142" stroke="#8b7355" stroke-width="1.5"/>
  <polygon points="593,142 586,138 586,146" fill="#8b7355"/>
  <text x="494" y="132" text-anchor="middle" fill="#2e7d32" font-family="monospace" font-size="12" font-weight="700">f: dy/du = 3</text>

  <!-- ─── nudge bars under each node (revealed per phase) ─────── -->
  <!-- baseline at y=250; bars grow upward -->
  <text x="360" y="200" text-anchor="middle" fill="#8b7355" font-family="monospace" font-size="11" font-weight="700">size of the nudge as it travels →</text>

  <!-- x: δ (height 16), always visible -->
  <rect x="80" y="234" width="20" height="16" fill="#6f42c1"/>
  <text x="90" y="266" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="12" font-weight="700">δ</text>

  <!-- u: 2δ (height 32), from phase 1 -->
  <g>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="350" y="218" width="20" height="32" fill="#6f42c1"/>
    <text x="360" y="266" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="12" font-weight="700">2δ</text>
  </g>

  <!-- y: 6δ (height 96), from phase 2 -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="620" y="154" width="20" height="96" fill="#6f42c1"/>
    <text x="630" y="266" text-anchor="middle" fill="#6f42c1" font-family="monospace" font-size="12" font-weight="700">6δ</text>
  </g>

  <!-- ─── travelling pulse ───────────────────────────────────── -->
  <circle r="7" fill="#6f42c1">
    <animate attributeName="cx" values="90;360;630" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="cy" values="186;186;186" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>

  <!-- ─── formula bar (3 phases) ─────────────────────────────── -->
  <rect x="30" y="288" width="660" height="58" rx="6" fill="#ede7d3" stroke="#c9b88a" stroke-width="1"/>
  <text x="360" y="312" text-anchor="middle" font-family="monospace" font-size="13" fill="#6f42c1" font-weight="700">
    dy/dx = dy/du × du/dx = 3 × 2 = 6
  </text>
  <text x="360" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220">
    <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    wiggle x by a tiny δ — that is the input nudge
  </text>
  <text x="360" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    g multiplies the nudge by its rate (×2): u moves by 2δ
  </text>
  <text x="360" y="334" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a4220">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="7.5s" calcMode="discrete" repeatCount="indefinite"/>
    f multiplies again (×3): y moves by 6δ — backprop is just this, computed in reverse
  </text>

</svg>
